<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>BoltStar 设备共享邀请</title>
<style>
  html,body{margin:0;min-height:100%}
  body{
    padding:0 20px calc(64px + env(safe-area-inset-bottom));box-sizing:border-box;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#2a2d32;background:#f2f5fc;-webkit-text-size-adjust:100%;
  }
  .page{max-width:420px;margin:0 auto;padding-top:calc(56px + env(safe-area-inset-top));text-align:center}
  .logo{width:76px;height:76px;border-radius:18px;box-shadow:0 8px 20px rgba(60,53,16,.12)}
  .brand{margin-top:10px;font-size:15px;font-weight:700;color:#5b6472;letter-spacing:.5px}
  .card{margin-top:26px;padding:24px 20px;border-radius:18px;background:#fff;
    box-shadow:0 4px 16px rgba(60,53,16,.08)}
  .tag{display:inline-block;padding:2px 12px;border-radius:999px;font-size:12px;font-weight:600;
    color:#ff621f;background:rgba(255,98,33,.1)}
  .invite{margin-top:14px;font-size:19px;font-weight:700;word-break:break-word}
  .device{margin-top:6px;color:#828a95;font-size:14px;word-break:break-word}
  .status{margin-top:18px;color:#828a95;font-size:14px;min-height:22px}
  .status.warn{color:#e5533d}
  .spin{display:inline-block;width:14px;height:14px;margin-right:6px;vertical-align:-2px;border-radius:50%;
    border:2px solid #e6ebf2;border-top-color:#ff6421;animation:r 1s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  .btn{display:block;width:100%;margin-top:14px;padding:13px 0;border:0;border-radius:999px;box-sizing:border-box;
    font-size:16px;font-weight:700;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .btn-primary{color:#fff;background:linear-gradient(90deg,#ff8338,#ff621f);box-shadow:0 9px 18px rgba(255,98,31,.22)}
  .btn-ghost{color:#ff621f;background:#fff;border:1px solid rgba(255,98,33,.45)}
  .btn[hidden]{display:none}
  .steps{margin:22px 0 0;padding:0;list-style:none;text-align:left;color:#5b6472;font-size:13px}
  .steps li{position:relative;padding:3px 0 3px 26px}
  .steps li b{position:absolute;left:0;top:5px;width:18px;height:18px;border-radius:50%;
    font-size:11px;line-height:18px;text-align:center;color:#fff;background:#ffb27d}
  .hint{margin-top:12px;color:#a8b0bb;font-size:12px}

  /* 微信内：遮罩 + 指向右上角的箭头（微信拦截拉起 App，只能让用户换浏览器打开） */
  .wx-mask{position:fixed;inset:0;z-index:20;background:rgba(15,17,20,.82);color:#fff;text-align:right}
  .wx-mask[hidden]{display:none}
  .wx-arrow{position:absolute;top:calc(6px + env(safe-area-inset-top));right:18px;width:84px;height:96px}
  .wx-text{position:absolute;top:calc(110px + env(safe-area-inset-top));left:24px;right:24px;text-align:left}
  .wx-title{font-size:20px;font-weight:700}
  .wx-line{margin-top:10px;font-size:15px;line-height:1.7;color:rgba(255,255,255,.88)}
  .wx-dots{display:inline-block;padding:0 7px;margin:0 2px;border-radius:6px;background:rgba(255,255,255,.18);font-weight:700}

  /* 调试日志：默认折叠；?debug=1 展开。手机上没有 devtools，拉起失败时靠它看走到了哪一步 */
  .log{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:1px solid #e6ebf2;text-align:left}
  .log-bar{padding:8px 14px calc(8px + env(safe-area-inset-bottom));color:#a8b0bb;font-size:12px;cursor:pointer;
    -webkit-user-select:none;user-select:none}
  .log-body{display:none;margin:0;padding:0 14px 10px;max-height:42vh;overflow:auto;
    white-space:pre-wrap;word-break:break-all;color:#5b6472;
    font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .log-copy{display:none;margin:0 14px 14px;padding:6px 16px;border:1px solid #d8e0ea;
    border-radius:8px;background:#f7f9fd;color:#5b6472;font-size:12px}
  .log.open .log-body,.log.open .log-copy{display:block}
</style>
</head>

<script>
(function () {
  // ════════════════════════════════════════════════════════════════════
  // BoltStar 设备共享邀请落地页（2026-11-12）
  //
  // 房主在 App「共享设备」里分享出来的就是本页链接：
  //   https://<部署域名>/<路径>/share.html?d=设备号&p=产品ID&u=房主userId&n=设备名&o=房主昵称&t=分享时间戳
  // （参数与小程序接受页卡片同一套；将来后端改成分享凭证，只带 ?k=凭证 也行——本页对参数整串透传，不解析重组。）
  //
  // 本页只做「落地 + 拉起 App」，不登录、不调绑定接口；真正建立共享关系在 App 的接受页里完成
  //（App 已登录，复用现有 addUserProduct：isToHave=0、shareUserId=房主）。
  //
  //   · 微信内（含企业微信）：微信拦截拉起 App，直接盖一层引导「点右上角 ··· → 在浏览器打开」，不尝试跳转；
  //   · 浏览器里：进页自动试一次拉起 App，同时摆出「打开 App」按钮（部分浏览器只放行用户点击触发的跳转）；
  //     页面被切到后台 = App 已被拉起；约 2.5 秒还停在本页 = 多半没装 → 切到「先下载 App」：
  //     下载、装好后回到本页点「已安装，打开 App」继续接受邀请。
  //
  // 网页没有可靠的「是否安装 App」接口，只能靠「跳一次 + 看页面有没有被切走」判断；
  // 安卓 Chrome 用 intent://，没装时浏览器自己回落到本页 #no-app（最准）。
  // ════════════════════════════════════════════════════════════════════

  // ── 部署时要核对 / 填写的配置 ────────────────────────────────────────
  var SCHEME = 'boltstar';                 // 与 App 的自定义 scheme 一致（PayPal 回跳已在用）
  var APP_PATH = 'share/accept';           // App 接受页深链：boltstar://share/accept?<原 query>
  var ANDROID_PACKAGE = 'com.boltfox.boltstar';
  // 下载地址：上线前填。安卓留空时，本页会试同域名的 /Client/Basic/getAndroidDownload（页面与 API 同域名才拿得到）
  var ANDROID_DOWNLOAD_URL = '';
  var IOS_APP_STORE_URL = '';               // 如 https://apps.apple.com/app/id<数字ID>
  var DETECT_MS = 2500;                     // 跳转后等多久还在本页就判「没装」

  // ── 文案（简中 / 繁中 / 英 / 日，跟随浏览器语言） ──────────────────────
  var TEXT = {
    zh: {
      tag: '设备共享邀请', inviteBy: '{o} 邀请你共享设备', invite: '你收到一个设备共享邀请',

      device: 'デバイス：{n}', opening: 'BoltStar アプリを開いています…', open: 'アプリを開いて招待を受ける',

      fetching: 'ダウンロード先を取得しています…',
      step1: 'BoltStar アプリをダウンロードしてインストール', step2: 'インストール後このページに戻り「インストール済み・アプリを開く」をタップ',
      step3: 'アプリでログインして招待を承認',
      hint: '自動で開かない場合は、上のボタンをもう一度タップしてください',
      wxTitle: 'ブラウザで開いてください', wxLine1: '右上の <span class="wx-dots">···</span> をタップし「{browser}」を選択',
      wxLine2: 'WeChat 内ではアプリを開けません。ブラウザに切り替えるとアプリを開いて招待を受けられます',
      wxBrowserIOS: 'Safari で開く', wxBrowserAndroid: 'ブラウザで開く',
      log: 'デバッグログ', copy: 'ログをコピー', copied: 'コピーしました', selected: '選択済み・長押しでコピー'
    }
  };

  function el(id) { return document.getElementById(id); }

  var ua = navigator.userAgent || '';
  var isAndroid = /android/i.test(ua);
  var isIOS = /iphone|ipad|ipod/i.test(ua) || (/macintosh/i.test(ua) && 'ontouchend' in document);
  var isWeChat = /micromessenger/i.test(ua);   // 企业微信 UA 里同样带 MicroMessenger

  var lang = (function () {
    var l = String(navigator.language || navigator.userLanguage || 'zh').toLowerCase();
    if (l.indexOf('zh') === 0) {
      return /hant|tw|hk|mo/.test(l) ? 'zhHant' : 'zh';
    }
    if (l.indexOf('ja') === 0) { return 'ja'; }
    if (l.indexOf('en') === 0) { return 'en'; }
    return 'zh';
  })();
  var T = TEXT[lang];
  document.documentElement.lang = { zh: 'zh-CN', zhHant: 'zh-TW', en: 'en', ja: 'ja' }[lang];

  function fill(text, values) {
    return text.replace(/\{(\w+)\}/g, function (_, key) { return values[key] == null ? '' : values[key]; });
  }

  // ── 屏幕内调试日志 ───────────────────────────────────────────────────
  var t0 = Date.now();
  var lines = [];
  var logBox = el('log');
  el('logcopy').textContent = T.copy;

  function log(text) {
    var ms = Date.now() - t0;
    lines.push('[+' + (ms < 1000 ? ms + 'ms' : (ms / 1000).toFixed(1) + 's') + '] ' + text);
    el('logbody').textContent = lines.join('\n');
    el('logbar').textContent = T.log + ' (' + lines.length + ') ▾';
    el('logbody').scrollTop = el('logbody').scrollHeight;
  }
  el('logbar').onclick = function () {
    logBox.className = logBox.className.indexOf('open') < 0 ? 'log open' : 'log';
  };
  el('logcopy').onclick = function () {
    var text = lines.join('\n');
    var done = function () { el('logcopy').textContent = T.copied; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, select);
    } else { select(); }
    function select() {
      var range = document.createRange();
      range.selectNodeContents(el('logbody'));
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      el('logcopy').textContent = T.selected;
    }
  };
  window.onerror = function (msg, src, line) { log('‼️ JS 错误：' + msg + ' @' + line); };

  // ── 参数 ────────────────────────────────────────────────────────────
  var query = window.location.search || '';
  var hash = window.location.hash || '';
  var params = {};
  query.replace(/^\?/, '').split('&').forEach(function (pair) {
    if (!pair) { return; }
    var at = pair.indexOf('=');
    var key = at < 0 ? pair : pair.slice(0, at);
    var value = at < 0 ? '' : pair.slice(at + 1);
    try { params[decodeURIComponent(key)] = decodeURIComponent(value.replace(/\+/g, ' ')); } catch (e) { params[key] = value; }
  });
  // 设备号（现行参数）或分享凭证 k（后端将来改凭证时）有其一即视为有效链接；真正校验（有效期、是否本人分享等）在 App 里做
  var valid = !!(params.d || params.k);
  // 安卓 Chrome 没装 App 时由 intent 的 browser_fallback_url 回落到本页，带 #no-app
  var cameBackNoApp = hash.indexOf('no-app') > -1;

  log('页面加载 ' + window.location.pathname + query + hash);
  log('UA=' + ua);
  log('平台=' + (isAndroid ? 'Android' : isIOS ? 'iOS' : '其他') + ' 微信=' + isWeChat + ' 语言=' + lang);
  if (/[?&]debug=1/.test(query)) { logBox.className = 'log open'; }

  // ── 文案落位（昵称 / 设备名来自链接，一律 textContent，不拼 HTML） ─────
  el('tag').textContent = T.tag;
  el('invite').textContent = params.o ? fill(T.inviteBy, { o: params.o }) : T.invite;
  el('device').textContent = params.n ? fill(T.device, { n: params.n }) : '';
  el('openBtn').textContent = T.open;
  el('downloadBtn').textContent = T.download;
  el('steps').innerHTML = '<li><b>1</b></li><li><b>2</b></li><li><b>3</b></li>';
  var stepItems = el('steps').getElementsByTagName('li');
  [T.step1, T.step2, T.step3].forEach(function (text, i) {
    stepItems[i].appendChild(document.createTextNode(text));
  });

  function setStatus(text, opts) {
    var status = el('status');
    status.className = 'status' + (opts && opts.warn ? ' warn' : '');
    status.innerHTML = '';
    if (opts && opts.spin) {
      var spin = document.createElement('span');
      spin.className = 'spin';
      status.appendChild(spin);
    }
    status.appendChild(document.createTextNode(text));
  }

  // 三种界面状态：
  //   opening  — 正在拉起：主按钮「打开 App」，下载按钮作次要，步骤隐藏；
  //   noApp    — 判定没装：主按钮换成「下载」，次要按钮「已安装，打开 App」，显示 1-2-3 步骤；
  //   invalid  — 链接缺参数：只提示，不给按钮。
  function showOpening() {
    setStatus(T.opening, { spin: true });
    el('openBtn').textContent = T.open;
    el('openBtn').className = 'btn btn-primary';
    el('downloadBtn').className = 'btn btn-ghost';
    el('openBtn').hidden = false;
    el('downloadBtn').hidden = false;
    el('steps').hidden = true;
    el('hint').textContent = T.hint;
    order(['openBtn', 'downloadBtn']);
  }

  function showNoApp() {
    setStatus(T.notFound, { warn: true });
    el('openBtn').textContent = T.openAgain;
    el('openBtn').className = 'btn btn-ghost';
    el('downloadBtn').className = 'btn btn-primary';
    el('openBtn').hidden = false;
    el('downloadBtn').hidden = false;
    el('steps').hidden = false;
    el('hint').textContent = '';
    order(['downloadBtn', 'openBtn']);
  }

  function showOpened() {
    setStatus(T.opened);
    el('openBtn').textContent = T.open;
    el('openBtn').className = 'btn btn-primary';
    el('downloadBtn').className = 'btn btn-ghost';
    el('steps').hidden = true;
    el('hint').textContent = '';
    order(['openBtn', 'downloadBtn']);
  }

  function showInvalid() {
    setStatus(T.invalid, { warn: true });
    el('openBtn').hidden = true;
    el('downloadBtn').hidden = true;
    el('steps').hidden = true;
    el('hint').textContent = '';
  }

  // 按钮顺序：主按钮在上
  function order(ids) {
    var anchor = el('steps');
    ids.forEach(function (id) { anchor.parentNode.insertBefore(el(id), anchor); });
  }

  // ── 拉起 App ────────────────────────────────────────────────────────
  //
  // 页面被切到后台 = App 被拉起。只认 visibilitychange / pagehide，**不认 blur**：
  // iOS「在 BoltStar 中打开？」确认框也会让页面 blur，用户点取消的话什么都没发生。
  var wentHidden = false;
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      if (!wentHidden) { log('✅ 页面被切到后台 → App 已被拉起'); }
      wentHidden = true;
    } else {
      log('页面回到前台');
    }
  });
  window.addEventListener('pagehide', function () {
    if (!wentHidden) { log('✅ pagehide → 已跳走'); }
    wentHidden = true;
  });

  // 参数整串透传给 App：boltstar://share/accept?d=..&p=..（不解析重组，避免编码 / 大小写走样）
  var deepLink = SCHEME + '://' + APP_PATH + query;
  function intentLink() {
    var fallback = window.location.origin + window.location.pathname + query + '#no-app';
    return 'intent://' + APP_PATH + query +
      '#Intent;scheme=' + SCHEME + ';package=' + ANDROID_PACKAGE +
      ';S.browser_fallback_url=' + encodeURIComponent(fallback) + ';end';
  }

  var detectTimer = null;
  var retryTimer = null;
  function tryOpen(reason) {
    wentHidden = false;
    clearTimeout(detectTimer);
    clearTimeout(retryTimer);
    showOpening();
    log('拉起 App（' + reason + '）：' + deepLink);
    // 安卓先试 intent://（Chrome 最稳，没装会按 browser_fallback_url 回落到本页 #no-app）；
    // 不少国产内核不认 intent://，900ms 还在本页再试一次朴素 scheme
    window.location.href = isAndroid ? intentLink() : deepLink;
    if (isAndroid) {
      retryTimer = setTimeout(function () {
        if (!wentHidden && !document.hidden) {
          log('900ms 仍在本页，改试朴素 scheme');
          window.location.href = deepLink;
        }
      }, 900);
    }
    detectTimer = setTimeout(function () {
      if (wentHidden || document.hidden) {
        showOpened();
        return;
      }
      log(DETECT_MS + 'ms 仍停在本页 → 判定没装 App（或浏览器拦截了跳转）');
      showNoApp();
    }, DETECT_MS);
  }

  // 已经拉起过、用户切回本页：给「已打开」的提示，不再自动跳（免得来回弹）
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && wentHidden) {
      clearTimeout(detectTimer);
      showOpened();
    }
  });

  // ── 下载 ────────────────────────────────────────────────────────────
  function goDownload() {
    if (isIOS) {
      if (IOS_APP_STORE_URL) {
        log('跳 App Store：' + IOS_APP_STORE_URL);
        window.location.href = IOS_APP_STORE_URL;
      } else {
        log('⚠️ 未配置 IOS_APP_STORE_URL');
        setStatus(T.noDownload, { warn: true });
      }
      return;
    }
    if (ANDROID_DOWNLOAD_URL) {
      log('跳安卓下载：' + ANDROID_DOWNLOAD_URL);
      window.location.href = ANDROID_DOWNLOAD_URL;
      return;
    }
    fetchAndroidDownload();
  }

  // 安卓下载地址兜底：与 App「检查更新」同一个接口（retData 为地址或 { url / fileUrl / filePath / path }）。
  // 用相对路径 = 只有本页与 API 同域名时才拿得到；跨域被拦就提示去应用商店搜。
  var fetching = false;
  function fetchAndroidDownload() {
    if (fetching || !window.fetch) {
      if (!window.fetch) { setStatus(T.noDownload, { warn: true }); }
      return;
    }
    fetching = true;
    setStatus(T.fetching, { spin: true });
    var url = '/Client/Basic/getAndroidDownload?terminal=1&language=' + ({ en: 1, zh: 2, zhHant: 3, ja: 4 }[lang]);
    log('请求安卓下载地址 GET ' + url);
    fetch(url, { credentials: 'omit' }).then(function (res) {
      return res.text().then(function (text) {
        log('← HTTP ' + res.status + ' ' + String(text).slice(0, 300));
        var body = JSON.parse(text);
        var data = body && body.retCode === 200 ? body.retData : null;
        if (data && typeof data === 'object' && data.length) { data = data[0]; }
        var link = typeof data === 'string' ? data
          : data && (data.url || data.fileUrl || data.filePath || data.path || data.fileParam || data.src);
        link = String(link || '').trim();
        if (!/^https?:\/\//i.test(link)) { throw new Error('没有可用的下载地址'); }
        return link;
      });
    }).then(function (link) {
      fetching = false;
      log('跳安卓下载：' + link);
      showNoApp();
      window.location.href = link;
    }, function (error) {
      fetching = false;
      log('⚠️ 取安卓下载地址失败：' + (error && error.message || error));
      setStatus(T.noDownload, { warn: true });
    });
  }

  el('openBtn').onclick = function (e) { e.preventDefault(); tryOpen('点击按钮'); };
  el('downloadBtn').onclick = function (e) { e.preventDefault(); goDownload(); };

  // ── 入口 ────────────────────────────────────────────────────────────
  if (!valid) {
    log('⚠️ 链接缺少设备参数（d）或分享凭证（k）');
    showInvalid();
  } else if (isWeChat) {
    // 微信拦截 scheme / Universal Link：不尝试跳转，直接引导去浏览器
    log('微信内打开 → 引导右上角在浏览器打开');
    el('wxTitle').textContent = T.wxTitle;
    el('wxLine1').innerHTML = fill(T.wxLine1, { browser: isIOS ? T.wxBrowserIOS : T.wxBrowserAndroid });
    el('wxLine2').textContent = T.wxLine2;
    el('wxMask').hidden = false;
    showOpening();
    setStatus('');
  } else if (cameBackNoApp) {
    log('intent 回落到本页 → 没装 App');
    showNoApp();
  } else {
    tryOpen('进页自动');
  }
})();
</script>
