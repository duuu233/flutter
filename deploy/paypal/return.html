<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>支付处理中</title>
<style>
  html,body{margin:0;height:100%}
  body{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;box-sizing:border-box;text-align:center;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#2a2d32;background:#f2f5fc;
  }
  .spin{width:34px;height:34px;margin-bottom:18px;border-radius:50%;
    border:3px solid #e6ebf2;border-top-color:#ff6421;animation:r 1s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  .tip{color:#828a95;font-size:14px}
  .btn{display:none;margin-top:22px;padding:13px 34px;border:0;border-radius:999px;
    color:#fff;font-size:16px;font-weight:700;
    background:linear-gradient(90deg,#ff8338,#ff621f);box-shadow:0 9px 18px rgba(255,98,31,.22)}
  .btn.show{display:inline-block;text-decoration:none}
  /* 排查用：拉不起 App 时把这次要跳的地址露出来，肉眼就能核 scheme/参数 */
  .diag{margin-top:14px;color:#a8b0bb;font-size:11px;word-break:break-all}
</style>
</head>
<body>
  <div class="spin" id="spin"></div>
  <div id="title">正在返回 App…</div>
  <div class="tip" id="tip">请稍候，不要关闭本页面</div>
  <a class="btn" id="btn" href="#">返回 App 查看结果</a>
  <div class="diag" id="diag"></div>

<script>
(function () {
  // PayPal 授权成功后把浏览器 302 到本页，query 上带着：
  //   ?token=<PayPal 订单号>&PayerID=<付款人>
  //
  // 本页做两件事，顺序不能反：
  //   ① 调 getPayPalNotify —— **后端拿这两个值去 capture（真正扣款）并入账**；
  //   ② 把 App 拉起来，并在深链上带回 notified=1，告诉 App「这一步我已经替你做了」。
  //
  // ⚠️ 为什么放在页面而不是等 App 来调：capture 从此**不依赖 App 能不能被拉起来**。
  //    深链失败、用户手动切回 App、甚至进程被杀，钱都已经扣了、星币已经入账，
  //    App 那边照常靠「余额变多」确认得到。这是本页存在的最大价值。
  //
  // ⚠️ 但**不能只靠页面**：这次 fetch 可能因为跨域/断网失败。所以失败时不带 notified，
  //    App 收到深链后会自己再调一次（见 star_purchase_page._confirm）。两条路互为兜底，
  //    正常情况下只有一条会真的 capture。
  var API      = 'https://api.boltfox.cn';
  var APP_PATH = 'pay/paypal/return';
  var SCHEME   = 'boltstar';
  var PACKAGE  = 'com.boltfox.boltstar';
  var NOTIFY_TIMEOUT_MS = 6000;   // 等后端 capture 的上限，超时就先回 App，别把人晾在网页上

  var query = window.location.search || '';
  var btn   = document.getElementById('btn');
  var diag  = document.getElementById('diag');

  function el(id) { return document.getElementById(id); }

  function setText(title, tip) {
    el('title').textContent = title;
    el('tip').textContent = tip;
  }

  // ⚠️ query 整串透传、不解析重组：PayerID 是大写 P 大写 ID，重组极易把大小写弄丢。
  // notified 只是追加一个参数，不动原有的部分。
  function deepLink(notified) {
    var q = query;
    if (notified) {
      q += (q ? '&' : '?') + 'notified=1';
    }
    return SCHEME + '://' + APP_PATH + q;
  }

  function giveUp(deep, text) {
    el('spin').style.display = 'none';
    el('title').textContent = '支付处理中';
    el('tip').textContent = text;
    btn.setAttribute('href', deep);
    btn.className = 'btn show';
    // 露出这次要跳的地址：排查时一眼看出 scheme/参数对不对，也方便复制出来用 adb 直接试。
    diag.textContent = deep;
  }

  function jump(notified) {
    var deep = deepLink(notified);
    btn.setAttribute('href', deep);
    setText('正在返回 App…', '请稍候，不要关闭本页面');

    var fallback = window.location.origin + window.location.pathname +
                   query + '#manual';
    var intent = 'intent://' + APP_PATH + (notified
                   ? (query ? query + '&notified=1' : '?notified=1')
                   : query) +
                 '#Intent;scheme=' + SCHEME +
                 ';package=' + PACKAGE +
                 ';S.browser_fallback_url=' + encodeURIComponent(fallback) +
                 ';end';
    var isAndroid = /android/i.test(navigator.userAgent);

    // ① 先试 intent://（安卓 Chrome 最稳）
    window.location.href = isAndroid ? intent : deep;

    // ② 900ms 还在本页，再试一次**朴素 scheme**：不少国产内核浏览器不认 intent:// 语法，
    //    却认 boltstar://。已经跳走的话本页脚本早就停了，多试一次没有副作用。
    var second = setTimeout(function () {
      if (isAndroid) { window.location.href = deep; }
    }, 900);

    // ③ 2.5 秒仍停在本页 = 都没拉起来，给手动出口。
    //    ⚠️ 措辞不能写「支付失败」：此刻钱多半已经扣成功了，只是 App 没被唤起。
    setTimeout(function () {
      clearTimeout(second);
      giveUp(deep, '如果没有自动返回，请点击下方按钮');
    }, 2500);
  }

  // 从 fallback 回来的：别再自动跳一次（会和刚才那次抢），也别重复调后端。
  if (window.location.hash === '#manual') {
    giveUp(deepLink(false), '请点击下方按钮返回 App 查看支付结果');
    return;
  }

  // 没有 token/PayerID（异常访问）：没什么可通知的，直接回 App 让它走查单兜底。
  if (query.indexOf('token=') < 0) {
    jump(false);
    return;
  }

  setText('正在确认支付结果…', '请稍候，不要关闭本页面');

  // ⚠️ **跨域**：本页在 pp.boltfox.cn，接口在 api.boltfox.cn。
  //    后端必须给 getPayPalNotify 放行 CORS（Access-Control-Allow-Origin），
  //    否则这次 fetch 会被浏览器拦掉 —— 那时走 catch 分支，不带 notified 回 App，
  //    由 App 再调一次，**流程仍然通**，只是 capture 晚了一步。
  var timeout = new Promise(function (resolve) {
    setTimeout(function () { resolve(null); }, NOTIFY_TIMEOUT_MS);
  });
  var request = fetch(API + '/Client/Pay/getPayPalNotify' + query, {
    method: 'GET',
    credentials: 'omit'
  }).then(function (r) { return r.json(); }).catch(function () { return null; });

  Promise.race([request, timeout]).then(function (body) {
    // retCode === 200 才算后端确认扣款成功。其余情况（失败/超时/跨域被拦）
    // 一律不带 notified，交给 App 再试一次 —— 宁可多调一次，也不能漏掉 capture。
    jump(!!body && body.retCode === 200);
  });
})();
</script>
</body>
</html>
